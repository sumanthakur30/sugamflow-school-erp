<div
  class="list-toolbar"
  [class.compact-mobile]="compactOnMobile"
  [class.extras-open]="extrasOpen"
>
  <div class="toolbar-row toolbar-primary">
    @if (showSearch) {
      <label class="search-field">
        <span class="sr-only">Search</span>
        <input
          [ngModel]="q"
          (ngModelChange)="onQInput($event)"
          [placeholder]="searchPlaceholder"
          (keyup.enter)="submitSearch()"
        />
      </label>
      <button type="button" class="search-btn" (click)="submitSearch()" [disabled]="searching">
        {{ searching ? 'Searching…' : 'Search' }}
      </button>
    }

    @if (compactOnMobile && hasExtras) {
      <button
        type="button"
        class="secondary filters-toggle"
        (click)="toggleExtras()"
        [attr.aria-expanded]="extrasOpen"
        [attr.aria-controls]="extrasPanelId"
      >
        {{ extrasOpen ? 'Hide filters' : 'Filters' }}
        @if (activeExtraCount > 0) {
          <span class="filter-count" aria-hidden="true">{{ activeExtraCount }}</span>
        }
      </button>
    }

    <div class="toolbar-inline-extras">
      @if (showStatus) {
        <label class="compact">
          {{ statusLabel }}
          <select [ngModel]="status" (ngModelChange)="onStatus($event)">
            <option value="">ALL</option>
            @for (opt of statusOptions!; track opt.value) {
              <option [value]="opt.value">{{ opt.label }}</option>
            }
          </select>
        </label>
      }

      @if (showSort) {
        <label class="compact">
          Sort by
          <select [ngModel]="sortBy" (ngModelChange)="onSortBy($event)">
            @for (opt of sortOptions; track opt.key) {
              <option [value]="opt.key">{{ opt.label }}</option>
            }
          </select>
        </label>
        <button
          type="button"
          class="secondary dir-btn"
          (click)="toggleDir()"
          [attr.aria-label]="'Sort ' + sortDir"
        >
          {{ sortDir }}
        </button>
      }

      @if (showPageSize) {
        <label class="compact">
          Page size
          <select [ngModel]="pageSize" (ngModelChange)="onPageSize($event)">
            @for (n of pageSizes; track n) {
              <option [ngValue]="n">{{ n }}</option>
            }
          </select>
        </label>
      }
    </div>

    @if (showFiltersToggle) {
      <button type="button" class="secondary" (click)="toggleFilters()">
        {{ filtersOpen ? 'Hide more' : 'More filters' }}
      </button>
    }

    <button
      type="button"
      class="secondary clear-btn"
      (click)="clearAll()"
      [disabled]="!clearEnabled && !q && !status"
    >
      Clear
    </button>
  </div>

  @if (compactOnMobile && hasExtras) {
    <div class="toolbar-row toolbar-drawer" [id]="extrasPanelId" role="region" aria-label="List filters">
      @if (showStatus) {
        <label class="compact">
          {{ statusLabel }}
          <select [ngModel]="status" (ngModelChange)="onStatus($event)">
            <option value="">ALL</option>
            @for (opt of statusOptions!; track opt.value) {
              <option [value]="opt.value">{{ opt.label }}</option>
            }
          </select>
        </label>
      }

      @if (showSort) {
        <label class="compact">
          Sort by
          <select [ngModel]="sortBy" (ngModelChange)="onSortBy($event)">
            @for (opt of sortOptions; track opt.key) {
              <option [value]="opt.key">{{ opt.label }}</option>
            }
          </select>
        </label>
        <button
          type="button"
          class="secondary dir-btn"
          (click)="toggleDir()"
          [attr.aria-label]="'Sort ' + sortDir"
        >
          {{ sortDir }}
        </button>
      }

      @if (showPageSize) {
        <label class="compact">
          Page size
          <select [ngModel]="pageSize" (ngModelChange)="onPageSize($event)">
            @for (n of pageSizes; track n) {
              <option [ngValue]="n">{{ n }}</option>
            }
          </select>
        </label>
      }
    </div>
  }

  @if (filtersOpen || !showFiltersToggle) {
    <div class="toolbar-filters">
      <ng-content select="[filters]"></ng-content>
    </div>
  }

  <ng-content></ng-content>
</div>
