name: CI

on:
  push:
    branches: [sugamflow-school-erp, main]
  pull_request:

jobs:
  backend-tests:
    name: Backend unit tests (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test all services
        working-directory: services
        run: mvn -B -ntp test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: services/**/target/surefire-reports/*.txt
          if-no-files-found: ignore

  ui-build:
    name: school-ui build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/school-ui/package-lock.json

      - name: Install dependencies
        working-directory: apps/school-ui
        run: npm ci

      - name: Build (production)
        working-directory: apps/school-ui
        run: npm run build
