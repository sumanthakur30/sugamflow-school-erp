spring.application.name=hostel-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8195}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888},optional:classpath:school-ops.defaults.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

spring.datasource.url=${SCHOOL_HOSTEL_DB_URL:jdbc:postgresql://localhost:5432/school_hostel_db}
spring.datasource.username=${SCHOOL_HOSTEL_DB_USERNAME:school_hostel}
spring.datasource.password=${SCHOOL_HOSTEL_DB_PASSWORD:school_hostel}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_hostel


hostel.integrations.forms-base-url=${HOSTEL_FORMS_URL:http://localhost:8183}
hostel.integrations.workflows-base-url=${HOSTEL_WORKFLOWS_URL:http://localhost:8184}
hostel.integrations.rules-base-url=${HOSTEL_RULES_URL:http://localhost:8185}
hostel.integrations.subscription-base-url=${HOSTEL_SUBSCRIPTION_URL:http://localhost:8182}
hostel.integrations.settings-base-url=${HOSTEL_SETTINGS_URL:http://localhost:8181}
hostel.integrations.notification-config-base-url=${HOSTEL_NOTIF_CFG_URL:http://localhost:8187}
hostel.integrations.reports-base-url=${HOSTEL_REPORTS_URL:http://localhost:8186}
hostel.integrations.notification-delivery-base-url=${HOSTEL_NOTIF_DELIVERY_URL:http://localhost:8087}
hostel.integrations.public-api-base-url=${HOSTEL_PUBLIC_API_URL:http://localhost:9090}

hostel.defaults.form-key=hostel_allocation
hostel.defaults.workflow-key=hostel
