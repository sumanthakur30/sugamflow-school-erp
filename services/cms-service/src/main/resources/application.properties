spring.application.name=cms-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8201}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888},optional:classpath:school-ops.defaults.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

spring.datasource.url=${SCHOOL_CMS_DB_URL:jdbc:postgresql://localhost:5432/school_cms_db}
spring.datasource.username=${SCHOOL_CMS_DB_USERNAME:school_cms}
spring.datasource.password=${SCHOOL_CMS_DB_PASSWORD:school_cms}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${CMS_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:5}}
spring.datasource.hikari.minimum-idle=${CMS_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:1}}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT_MS:10000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_cms

cms.integrations.subscription-base-url=${CMS_SUBSCRIPTION_URL:http://localhost:8182}
cms.media.storage-dir=${CMS_MEDIA_STORAGE_DIR:${java.io.tmpdir}/school-cms-media}
cms.media.public-base-url=${CMS_MEDIA_PUBLIC_BASE_URL:}
# S3 / MinIO (optional). When enabled, uploads go to the bucket; public URLs use CDN base.
cms.media.s3.enabled=${CMS_MEDIA_S3_ENABLED:false}
cms.media.s3.bucket=${CMS_MEDIA_S3_BUCKET:}
cms.media.s3.region=${CMS_MEDIA_S3_REGION:ap-south-1}
cms.media.s3.key-prefix=${CMS_MEDIA_S3_KEY_PREFIX:school-cms/}
cms.media.s3.endpoint=${CMS_MEDIA_S3_ENDPOINT:}
cms.media.s3.access-key=${CMS_MEDIA_S3_ACCESS_KEY:}
cms.media.s3.secret-key=${CMS_MEDIA_S3_SECRET_KEY:}
cms.media.cdn-base-url=${CMS_MEDIA_CDN_BASE_URL:${WEBSITE_CDN_BASE_URL:}}
spring.servlet.multipart.max-file-size=${CMS_MEDIA_MAX_FILE:25MB}
spring.servlet.multipart.max-request-size=${CMS_MEDIA_MAX_REQUEST:30MB}
