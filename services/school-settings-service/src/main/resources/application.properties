# Business settings / Design Studio (NOT Spring Cloud Config Server).
spring.application.name=school-settings-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8181}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888},optional:classpath:school-ops.defaults.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# PostgreSQL (shared host with SugamFlow â€” localhost:5432)
spring.datasource.url=${SCHOOL_SETTINGS_DB_URL:jdbc:postgresql://localhost:5432/school_settings_db}
spring.datasource.username=${SCHOOL_SETTINGS_DB_USERNAME:school_settings}
spring.datasource.password=${SCHOOL_SETTINGS_DB_PASSWORD:school_settings}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_settings


eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

settings.integrations.audit-base-url=${SETTINGS_AUDIT_URL:http://localhost:8188}
settings.integrations.subscription-base-url=${SETTINGS_SUBSCRIPTION_URL:http://localhost:8182}
settings.integrations.public-api-base-url=${SETTINGS_PUBLIC_API_URL:http://localhost:9090}
