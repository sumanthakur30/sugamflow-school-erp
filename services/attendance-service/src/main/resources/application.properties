spring.application.name=attendance-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8192}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888},optional:classpath:school-ops.defaults.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

spring.datasource.url=${SCHOOL_ATTENDANCE_DB_URL:jdbc:postgresql://localhost:5432/school_attendance_db}
spring.datasource.username=${SCHOOL_ATTENDANCE_DB_USERNAME:school_attendance}
spring.datasource.password=${SCHOOL_ATTENDANCE_DB_PASSWORD:school_attendance}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hot service: per-service override first, then global, then a higher default.
spring.datasource.hikari.maximum-pool-size=${ATTENDANCE_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:8}}
spring.datasource.hikari.minimum-idle=${ATTENDANCE_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:2}}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT_MS:10000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_attendance


attendance.integrations.forms-base-url=${ATTENDANCE_FORMS_URL:http://localhost:8183}
attendance.integrations.workflows-base-url=${ATTENDANCE_WORKFLOWS_URL:http://localhost:8184}
attendance.integrations.rules-base-url=${ATTENDANCE_RULES_URL:http://localhost:8185}
attendance.integrations.subscription-base-url=${ATTENDANCE_SUBSCRIPTION_URL:http://localhost:8182}
attendance.integrations.settings-base-url=${ATTENDANCE_SETTINGS_URL:http://localhost:8181}
attendance.integrations.notification-config-base-url=${ATTENDANCE_NOTIF_CFG_URL:http://localhost:8187}
attendance.integrations.reports-base-url=${ATTENDANCE_REPORTS_URL:http://localhost:8186}
attendance.integrations.notification-delivery-base-url=${ATTENDANCE_NOTIF_DELIVERY_URL:http://localhost:8087}
attendance.integrations.public-api-base-url=${ATTENDANCE_PUBLIC_API_URL:http://localhost:9090}
attendance.integrations.student-base-url=${ATTENDANCE_STUDENT_URL:http://localhost:8191}
attendance.integrations.academic-base-url=${ATTENDANCE_ACADEMIC_URL:http://localhost:8199}

attendance.defaults.form-key=attendance_mark
attendance.defaults.workflow-key=attendance
