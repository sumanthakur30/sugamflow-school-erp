spring.application.name=admission-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8189}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888},optional:classpath:school-ops.defaults.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

spring.datasource.url=${SCHOOL_ADMISSION_DB_URL:jdbc:postgresql://localhost:5432/school_admission_db}
spring.datasource.username=${SCHOOL_ADMISSION_DB_USERNAME:school_admission}
spring.datasource.password=${SCHOOL_ADMISSION_DB_PASSWORD:school_admission}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hot service: per-service override first, then global, then a higher default.
spring.datasource.hikari.maximum-pool-size=${ADMISSION_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:8}}
spring.datasource.hikari.minimum-idle=${ADMISSION_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:2}}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT_MS:10000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_admission


# Direct host URLs for config engines (bypass gateway JWT on service-to-service calls)
admission.integrations.forms-base-url=${ADMISSION_FORMS_URL:http://localhost:8183}
admission.integrations.workflows-base-url=${ADMISSION_WORKFLOWS_URL:http://localhost:8184}
admission.integrations.rules-base-url=${ADMISSION_RULES_URL:http://localhost:8185}
admission.integrations.subscription-base-url=${ADMISSION_SUBSCRIPTION_URL:http://localhost:8182}
admission.integrations.settings-base-url=${ADMISSION_SETTINGS_URL:http://localhost:8181}
admission.integrations.notification-config-base-url=${ADMISSION_NOTIF_CFG_URL:http://localhost:8187}
admission.integrations.reports-base-url=${ADMISSION_REPORTS_URL:http://localhost:8186}
admission.integrations.notification-delivery-base-url=${ADMISSION_NOTIF_DELIVERY_URL:http://localhost:8087}
admission.integrations.public-api-base-url=${ADMISSION_PUBLIC_API_URL:http://localhost:9090}
admission.integrations.student-base-url=${ADMISSION_STUDENT_URL:http://localhost:8191}

admission.defaults.form-key=admission_form
admission.defaults.workflow-key=admission
admission.defaults.offer-letter-template-key=offer_letter
# Public website apply captcha (off locally; enable in prod with reCAPTCHA secret)
admission.public-captcha.enabled=${ADMISSION_PUBLIC_CAPTCHA_ENABLED:false}
admission.public-captcha.secret=${ADMISSION_PUBLIC_CAPTCHA_SECRET:}
admission.public-captcha.verify-url=${ADMISSION_PUBLIC_CAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
