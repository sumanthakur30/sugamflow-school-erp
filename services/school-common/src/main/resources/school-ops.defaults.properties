# Defaults applied by SchoolOpsEnvironmentPostProcessor (school-common).
# Lowest precedence — application.properties / env vars always win.

school.http.connect-timeout-ms=3000
school.http.read-timeout-ms=10000

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name:school-service}

logging.pattern.level=%5p [${spring.application.name:school},%X{requestId:-},%X{tenantId:-},%X{userId:-}]
