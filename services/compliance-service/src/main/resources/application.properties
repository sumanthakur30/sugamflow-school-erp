spring.application.name=compliance-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8202}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888},optional:classpath:school-ops.defaults.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

spring.datasource.url=${SCHOOL_COMPLIANCE_DB_URL:jdbc:postgresql://localhost:5432/school_compliance_db}
spring.datasource.username=${SCHOOL_COMPLIANCE_DB_USERNAME:school_compliance}
spring.datasource.password=${SCHOOL_COMPLIANCE_DB_PASSWORD:school_compliance}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_compliance

compliance.integrations.subscription-base-url=${COMPLIANCE_SUBSCRIPTION_URL:http://localhost:8182}
compliance.integrations.student-base-url=${COMPLIANCE_STUDENT_URL:http://localhost:8191}
compliance.integrations.staff-base-url=${COMPLIANCE_STAFF_URL:http://localhost:8198}
compliance.integrations.cms-base-url=${COMPLIANCE_CMS_URL:http://localhost:8201}
compliance.documents.storage-dir=${COMPLIANCE_DOCUMENTS_DIR:./data/compliance-documents}
compliance.documents.max-file-bytes=${COMPLIANCE_DOCUMENTS_MAX_BYTES:15000000}
compliance.documents.expiry-warn-days=${COMPLIANCE_DOCUMENTS_EXPIRY_WARN_DAYS:60}
compliance.exports.storage-dir=${COMPLIANCE_EXPORTS_DIR:./data/compliance-exports}
compliance.ai.api-url=${COMPLIANCE_AI_API_URL:}
compliance.ai.api-key=${COMPLIANCE_AI_API_KEY:}
compliance.ai.model=${COMPLIANCE_AI_MODEL:gpt-4o-mini}
compliance.adapters.sftp.enabled=${COMPLIANCE_ADAPTER_SFTP_ENABLED:false}
compliance.adapters.sftp.host=${COMPLIANCE_ADAPTER_SFTP_HOST:}
compliance.adapters.rest.enabled=${COMPLIANCE_ADAPTER_REST_ENABLED:false}
compliance.adapters.rest.endpoint=${COMPLIANCE_ADAPTER_REST_ENDPOINT:}
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=18MB
