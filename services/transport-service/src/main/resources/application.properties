spring.application.name=transport-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8196}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

spring.datasource.url=${SCHOOL_TRANSPORT_DB_URL:jdbc:postgresql://localhost:5432/school_transport_db}
spring.datasource.username=${SCHOOL_TRANSPORT_DB_USERNAME:school_transport}
spring.datasource.password=${SCHOOL_TRANSPORT_DB_PASSWORD:school_transport}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_transport

management.endpoints.web.exposure.include=health,info,db
management.health.db.enabled=true

transport.integrations.forms-base-url=${TRANSPORT_FORMS_URL:http://localhost:8183}
transport.integrations.workflows-base-url=${TRANSPORT_WORKFLOWS_URL:http://localhost:8184}
transport.integrations.rules-base-url=${TRANSPORT_RULES_URL:http://localhost:8185}
transport.integrations.subscription-base-url=${TRANSPORT_SUBSCRIPTION_URL:http://localhost:8182}
transport.integrations.settings-base-url=${TRANSPORT_SETTINGS_URL:http://localhost:8181}
transport.integrations.notification-config-base-url=${TRANSPORT_NOTIF_CFG_URL:http://localhost:8187}
transport.integrations.reports-base-url=${TRANSPORT_REPORTS_URL:http://localhost:8186}
transport.integrations.notification-delivery-base-url=${TRANSPORT_NOTIF_DELIVERY_URL:http://localhost:8087}
transport.integrations.public-api-base-url=${TRANSPORT_PUBLIC_API_URL:http://localhost:9090}

transport.defaults.form-key=transport_route
transport.defaults.workflow-key=transport
