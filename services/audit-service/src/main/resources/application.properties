spring.application.name=audit-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8188}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=${SCHOOL_AUDIT_DB_URL:jdbc:postgresql://localhost:5432/school_audit_db}
spring.datasource.username=${SCHOOL_AUDIT_DB_USERNAME:school_audit}
spring.datasource.password=${SCHOOL_AUDIT_DB_PASSWORD:school_audit}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_audit

management.endpoints.web.exposure.include=health,info,db
management.health.db.enabled=true

eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

audit.integrations.subscription-base-url=${AUDIT_SUBSCRIPTION_URL:http://localhost:8182}
audit.integrations.settings-base-url=${AUDIT_SETTINGS_URL:http://localhost:8181}

