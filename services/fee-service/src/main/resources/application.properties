spring.application.name=fee-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8190}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888},optional:classpath:school-ops.defaults.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

spring.datasource.url=${SCHOOL_FEE_DB_URL:jdbc:postgresql://localhost:5432/school_fee_db}
spring.datasource.username=${SCHOOL_FEE_DB_USERNAME:school_fee}
spring.datasource.password=${SCHOOL_FEE_DB_PASSWORD:school_fee}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hot service: per-service override first, then global, then a higher default.
spring.datasource.hikari.maximum-pool-size=${FEE_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:8}}
spring.datasource.hikari.minimum-idle=${FEE_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:2}}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT_MS:10000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_fee


fee.integrations.forms-base-url=${FEE_FORMS_URL:http://localhost:8183}
fee.integrations.workflows-base-url=${FEE_WORKFLOWS_URL:http://localhost:8184}
fee.integrations.rules-base-url=${FEE_RULES_URL:http://localhost:8185}
fee.integrations.subscription-base-url=${FEE_SUBSCRIPTION_URL:http://localhost:8182}
fee.integrations.settings-base-url=${FEE_SETTINGS_URL:http://localhost:8181}
fee.integrations.notification-config-base-url=${FEE_NOTIF_CFG_URL:http://localhost:8187}
fee.integrations.reports-base-url=${FEE_REPORTS_URL:http://localhost:8186}
fee.integrations.notification-delivery-base-url=${FEE_NOTIF_DELIVERY_URL:http://localhost:8087}
fee.integrations.student-base-url=${FEE_STUDENT_URL:http://localhost:8191}
fee.integrations.public-api-base-url=${FEE_PUBLIC_API_URL:http://localhost:9090}

fee.defaults.form-key=fee_collection
fee.defaults.workflow-key=fee
fee.defaults.fee-receipt-template-key=fee_receipt

# Payment gateway: simulate (default) | auto | razorpay
fee.payment.mode=${FEE_PAYMENT_MODE:simulate}
fee.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
fee.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
fee.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
