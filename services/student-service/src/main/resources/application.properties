spring.application.name=student-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8191}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

spring.datasource.url=${SCHOOL_STUDENT_DB_URL:jdbc:postgresql://localhost:5432/school_student_db}
spring.datasource.username=${SCHOOL_STUDENT_DB_USERNAME:school_student}
spring.datasource.password=${SCHOOL_STUDENT_DB_PASSWORD:school_student}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_student

management.endpoints.web.exposure.include=health,info,db
management.health.db.enabled=true

student.integrations.forms-base-url=${STUDENT_FORMS_URL:http://localhost:8183}
student.integrations.subscription-base-url=${STUDENT_SUBSCRIPTION_URL:http://localhost:8182}
student.integrations.settings-base-url=${STUDENT_SETTINGS_URL:http://localhost:8181}
student.integrations.reports-base-url=${STUDENT_REPORTS_URL:http://localhost:8186}
student.integrations.rules-base-url=${STUDENT_RULES_URL:http://localhost:8185}
student.integrations.fee-base-url=${STUDENT_FEE_URL:http://localhost:8190}
student.integrations.library-base-url=${STUDENT_LIBRARY_URL:http://localhost:8194}

student.defaults.form-key=student_master
