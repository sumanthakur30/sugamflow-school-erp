spring.application.name=payroll-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8197}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

spring.datasource.url=${SCHOOL_PAYROLL_DB_URL:jdbc:postgresql://localhost:5432/school_payroll_db}
spring.datasource.username=${SCHOOL_PAYROLL_DB_USERNAME:school_payroll}
spring.datasource.password=${SCHOOL_PAYROLL_DB_PASSWORD:school_payroll}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_payroll

management.endpoints.web.exposure.include=health,info,db
management.health.db.enabled=true

payroll.integrations.forms-base-url=${PAYROLL_FORMS_URL:http://localhost:8183}
payroll.integrations.workflows-base-url=${PAYROLL_WORKFLOWS_URL:http://localhost:8184}
payroll.integrations.rules-base-url=${PAYROLL_RULES_URL:http://localhost:8185}
payroll.integrations.subscription-base-url=${PAYROLL_SUBSCRIPTION_URL:http://localhost:8182}
payroll.integrations.settings-base-url=${PAYROLL_SETTINGS_URL:http://localhost:8181}
payroll.integrations.notification-config-base-url=${PAYROLL_NOTIF_CFG_URL:http://localhost:8187}
payroll.integrations.reports-base-url=${PAYROLL_REPORTS_URL:http://localhost:8186}
payroll.integrations.notification-delivery-base-url=${PAYROLL_NOTIF_DELIVERY_URL:http://localhost:8087}
payroll.integrations.public-api-base-url=${PAYROLL_PUBLIC_API_URL:http://localhost:9090}

payroll.defaults.form-key=payroll_run
payroll.defaults.workflow-key=payroll
