spring.application.name=subscription-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8182}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888},optional:classpath:school-ops.defaults.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=${SCHOOL_SUBSCRIPTION_DB_URL:jdbc:postgresql://localhost:5432/school_subscription_db}
spring.datasource.username=${SCHOOL_SUBSCRIPTION_DB_USERNAME:school_subscription}
spring.datasource.password=${SCHOOL_SUBSCRIPTION_DB_PASSWORD:school_subscription}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_subscription


eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Phase 7: Redis plan/entitlement cache (default OFF — no Redis required locally).
# Client TtlCache (SCHOOL_CONFIG_CACHE_TTL_SECONDS) remains the consumer-side fallback.
subscription.cache.enabled=${SUBSCRIPTION_CACHE_ENABLED:false}
subscription.cache.host=${SUBSCRIPTION_CACHE_REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
subscription.cache.port=${SUBSCRIPTION_CACHE_REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
subscription.cache.password=${SUBSCRIPTION_CACHE_REDIS_PASSWORD:${SPRING_DATA_REDIS_PASSWORD:}}
subscription.cache.database=${SUBSCRIPTION_CACHE_REDIS_DB:0}
subscription.cache.ttl-seconds=${SUBSCRIPTION_CACHE_TTL_SECONDS:60}

# Phase 9: Razorpay for subscription invoices (blank keys → simulate checkout).
# Mode: auto | razorpay | simulate
subscription.payment.mode=${SUBSCRIPTION_PAYMENT_MODE:auto}
subscription.payment.razorpay.key-id=${SUBSCRIPTION_RAZORPAY_KEY_ID:${RAZORPAY_KEY_ID:}}
subscription.payment.razorpay.key-secret=${SUBSCRIPTION_RAZORPAY_KEY_SECRET:${RAZORPAY_KEY_SECRET:}}
subscription.payment.razorpay.webhook-secret=${SUBSCRIPTION_RAZORPAY_WEBHOOK_SECRET:${RAZORPAY_WEBHOOK_SECRET:}}
