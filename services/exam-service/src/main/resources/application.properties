spring.application.name=exam-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8193}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888},optional:classpath:school-ops.defaults.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

spring.datasource.url=${SCHOOL_EXAM_DB_URL:jdbc:postgresql://localhost:5432/school_exam_db}
spring.datasource.username=${SCHOOL_EXAM_DB_USERNAME:school_exam}
spring.datasource.password=${SCHOOL_EXAM_DB_PASSWORD:school_exam}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hot service: per-service override first, then global, then a higher default.
spring.datasource.hikari.maximum-pool-size=${EXAM_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:8}}
spring.datasource.hikari.minimum-idle=${EXAM_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:2}}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT_MS:10000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_exam


exam.integrations.forms-base-url=${EXAM_FORMS_URL:http://localhost:8183}
exam.integrations.workflows-base-url=${EXAM_WORKFLOWS_URL:http://localhost:8184}
exam.integrations.rules-base-url=${EXAM_RULES_URL:http://localhost:8185}
exam.integrations.subscription-base-url=${EXAM_SUBSCRIPTION_URL:http://localhost:8182}
exam.integrations.settings-base-url=${EXAM_SETTINGS_URL:http://localhost:8181}
exam.integrations.notification-config-base-url=${EXAM_NOTIF_CFG_URL:http://localhost:8187}
exam.integrations.reports-base-url=${EXAM_REPORTS_URL:http://localhost:8186}
exam.integrations.notification-delivery-base-url=${EXAM_NOTIF_DELIVERY_URL:http://localhost:8087}
exam.integrations.public-api-base-url=${EXAM_PUBLIC_API_URL:http://localhost:9090}
exam.integrations.student-base-url=${EXAM_STUDENT_URL:http://localhost:8191}
exam.integrations.academic-base-url=${EXAM_ACADEMIC_URL:http://localhost:8199}

exam.defaults.form-key=exam_marks
exam.defaults.workflow-key=exam
