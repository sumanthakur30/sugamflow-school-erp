spring.application.name=form-builder-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8183}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888},optional:classpath:school-ops.defaults.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=${SCHOOL_FORMS_DB_URL:jdbc:postgresql://localhost:5432/school_forms_db}
spring.datasource.username=${SCHOOL_FORMS_DB_USERNAME:school_forms}
spring.datasource.password=${SCHOOL_FORMS_DB_PASSWORD:school_forms}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_forms


eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
