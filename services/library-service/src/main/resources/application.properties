spring.application.name=library-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8194}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

spring.datasource.url=${SCHOOL_LIBRARY_DB_URL:jdbc:postgresql://localhost:5432/school_library_db}
spring.datasource.username=${SCHOOL_LIBRARY_DB_USERNAME:school_library}
spring.datasource.password=${SCHOOL_LIBRARY_DB_PASSWORD:school_library}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_library

management.endpoints.web.exposure.include=health,info,db
management.health.db.enabled=true

library.integrations.forms-base-url=${LIBRARY_FORMS_URL:http://localhost:8183}
library.integrations.workflows-base-url=${LIBRARY_WORKFLOWS_URL:http://localhost:8184}
library.integrations.rules-base-url=${LIBRARY_RULES_URL:http://localhost:8185}
library.integrations.subscription-base-url=${LIBRARY_SUBSCRIPTION_URL:http://localhost:8182}
library.integrations.settings-base-url=${LIBRARY_SETTINGS_URL:http://localhost:8181}
library.integrations.notification-config-base-url=${LIBRARY_NOTIF_CFG_URL:http://localhost:8187}
library.integrations.reports-base-url=${LIBRARY_REPORTS_URL:http://localhost:8186}
library.integrations.notification-delivery-base-url=${LIBRARY_NOTIF_DELIVERY_URL:http://localhost:8087}
library.integrations.public-api-base-url=${LIBRARY_PUBLIC_API_URL:http://localhost:9090}

library.defaults.form-key=library_issue
library.defaults.workflow-key=library
