spring.application.name=website-service
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8200}
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888},optional:classpath:school-ops.defaults.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

spring.datasource.url=${SCHOOL_WEBSITE_DB_URL:jdbc:postgresql://localhost:5432/school_website_db}
spring.datasource.username=${SCHOOL_WEBSITE_DB_USERNAME:school_website}
spring.datasource.password=${SCHOOL_WEBSITE_DB_PASSWORD:school_website}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${WEBSITE_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:5}}
spring.datasource.hikari.minimum-idle=${WEBSITE_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:1}}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT_MS:10000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_school_website

# Default ERP login host for deep-links (overridable per site).
website.defaults.erp-login-url=${WEBSITE_DEFAULT_ERP_LOGIN_URL:https://school.sugamflow.com/login}
website.integrations.cms-base-url=${WEBSITE_CMS_URL:http://localhost:8201}
website.integrations.subscription-base-url=${WEBSITE_SUBSCRIPTION_URL:http://localhost:8182}
# Optional CDN origin for media/static assets (CloudFront / Nginx). Empty = same origin.
website.cdn.base-url=${WEBSITE_CDN_BASE_URL:}
website.analytics.retention-days=${WEBSITE_ANALYTICS_RETENTION_DAYS:90}
