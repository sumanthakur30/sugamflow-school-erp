# /etc/nginx/conf.d/hcpschool.com.conf
# After upload: sudo nginx -t && sudo systemctl reload nginx

server {
  listen 80;
  server_name hcpschool.com www.hcpschool.com;

  # ACME / Certbot
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/hcpschool.com;
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name hcpschool.com www.hcpschool.com;

  ssl_certificate     /etc/letsencrypt/live/hcpschool.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hcpschool.com/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/hcpschool.com;
  index index.html;

  # Backend APIs (must be before SPA catch-all)
  location /api/ {
    proxy_pass http://127.0.0.1:9090/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
