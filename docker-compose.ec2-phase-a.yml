      SERVER_PORT: 8190
      SCHOOL_FEE_DB_URL: ${SCHOOL_FEE_DB_URL}
      SCHOOL_FEE_DB_USERNAME: ${SCHOOL_FEE_DB_USERNAME}
      SCHOOL_FEE_DB_PASSWORD: ${SCHOOL_FEE_DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${SCHOOL_FEE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SCHOOL_FEE_DB_USERNAME}
