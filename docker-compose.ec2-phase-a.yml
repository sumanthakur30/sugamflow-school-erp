      SCHOOL_STUDENT_DB_PASSWORD: ${SCHOOL_STUDENT_DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${SCHOOL_STUDENT_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SCHOOL_STUDENT_DB_USERNAME}
