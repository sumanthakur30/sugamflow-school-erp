    image: ${IMAGE_PREFIX:-sumanthakur30}/staff-service:${SCHOOL_IMAGE_TAG:-${IMAGE_TAG:-1.0.0}}
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: staff-service
      SERVER_PORT: 8198
      SCHOOL_STAFF_DB_URL: ${SCHOOL_STAFF_DB_URL}
      SCHOOL_STAFF_DB_USERNAME: ${SCHOOL_STAFF_DB_USERNAME}
      SCHOOL_STAFF_DB_PASSWORD: ${SCHOOL_STAFF_DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${SCHOOL_STAFF_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SCHOOL_STAFF_DB_USERNAME}
