      WEBSITE_CDN_BASE_URL: ${WEBSITE_CDN_BASE_URL:-}
      WEBSITE_DEFAULT_ERP_LOGIN_URL: ${WEBSITE_DEFAULT_ERP_LOGIN_URL:-https://school.sugamflow.com/login}

  cms-service:
    <<: *jvm-service
    profiles: ["website"]
    image: ${IMAGE_PREFIX:-sumanthakur30}/cms-service:${IMAGE_TAG:-1.0.0}
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: cms-service
      SERVER_PORT: 8201
      SCHOOL_CMS_DB_URL: ${SCHOOL_CMS_DB_URL}
      SCHOOL_CMS_DB_USERNAME: ${SCHOOL_CMS_DB_USERNAME}
      SCHOOL_CMS_DB_PASSWORD: ${SCHOOL_CMS_DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${SCHOOL_CMS_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SCHOOL_CMS_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SCHOOL_CMS_DB_PASSWORD}
      CMS_SUBSCRIPTION_URL: http://subscription-service:8182
      WEBSITE_CDN_BASE_URL: ${WEBSITE_CDN_BASE_URL:-}
      CMS_MEDIA_CDN_BASE_URL: ${CMS_MEDIA_CDN_BASE_URL:-}
      CMS_MEDIA_S3_ENABLED: ${CMS_MEDIA_S3_ENABLED:-false}
      CMS_MEDIA_S3_BUCKET: ${CMS_MEDIA_S3_BUCKET:-}
      CMS_MEDIA_S3_REGION: ${CMS_MEDIA_S3_REGION:-ap-south-1}
      CMS_MEDIA_S3_ENDPOINT: ${CMS_MEDIA_S3_ENDPOINT:-}
      CMS_MEDIA_S3_ACCESS_KEY: ${CMS_MEDIA_S3_ACCESS_KEY:-}
      CMS_MEDIA_S3_SECRET_KEY: ${CMS_MEDIA_S3_SECRET_KEY:-}

  compliance-service:
