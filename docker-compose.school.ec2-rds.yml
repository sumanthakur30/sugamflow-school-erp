      SPRING_DATASOURCE_USERNAME: ${SCHOOL_SUBSCRIPTION_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SCHOOL_SUBSCRIPTION_DB_PASSWORD}
      # Older school service images may not send X-Gateway-Verified on internal hops.
      # Keep false until all callers are rebuilt with TenantHeaders.apply (sets verified+internal).
      SCHOOL_SECURITY_REQUIRE_GATEWAY_VERIFIED: ${SCHOOL_SECURITY_REQUIRE_GATEWAY_VERIFIED:-false}

