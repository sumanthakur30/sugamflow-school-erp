# School ERP - EC2 + AWS RDS (pull-only images).
# Distinct from SugamFlow filenames so they never clash on the same EC2:
#   SugamFlow:  docker-compose.ec2-rds.yml  + .env.production
#   School:     docker-compose.school.ec2-rds.yml + .env.school.production
#
# Target host: sugamflows (m7i-flex.xlarge, ~16 GiB)
# Folder on EC2: /home/ec2-user/opt/school
# Joins EXISTING SugamFlow Docker network (discovery/gateway already running).
# Does NOT publish school ports to the host - traffic enters via gateway :9090.
#
# Prerequisites:
#   1) SugamFlow up: docker-compose.ec2-rds.yml (project name: sumanthakur30)
#   2) RDS school_* databases + users created
#   3) Images on Docker Hub: ${IMAGE_PREFIX}/<service>:${IMAGE_TAG}
#   4) .env.school.production filled (copy from .env.school.production.example)
#
# Phase A (default - core 9 services, no profile required):
#   cd /home/ec2-user/opt/school
#   docker compose -f docker-compose.school.ec2-rds.yml --env-file .env.school.production pull
#   docker compose -f docker-compose.school.ec2-rds.yml --env-file .env.school.production up -d
#   docker compose -f docker-compose.school.ec2-rds.yml --env-file .env.school.production ps
#
# Phase B (payroll, attendance, exam, library, hostel, transport, comms):
#   COMPOSE_PROFILES=phase-b docker compose -f docker-compose.school.ec2-rds.yml \
#     --env-file .env.school.production up -d
#   # or: docker compose ... --profile phase-b up -d
#
# Verify:
#   curl -sS http://127.0.0.1:9090/actuator/health
#   curl -sS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:9090/api/student/health
#
# Stop school stack only (shop untouched):
#   docker compose -f docker-compose.school.ec2-rds.yml --env-file .env.school.production --profile phase-b down
#
# Flyway: each service migrates its own school_*_db on first start.

name: school

x-logging: &docker-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "3"

x-jvm-service: &jvm-service
  restart: unless-stopped
  logging: *docker-logging
  mem_limit: ${JVM_SERVICE_MEM_LIMIT:-384m}
  oom_score_adj: 300
  networks:
    - sugamflow_net

x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  TZ: Asia/Kolkata
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Duser.timezone=Asia/Kolkata -Xms96m -Xmx192m -XX:+ExitOnOutOfMemoryError}
  SPRING_CLOUD_CONFIG_URI: http://config-service:8888
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "10"
  EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "30"
  # Defaults match .env.school.production (Flyway needs max >= 3)
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_MAX_SIZE:-5}
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${DB_POOL_MIN_IDLE:-0}
  SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: ${DB_POOL_IDLE_TIMEOUT_MS:-120000}
  SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: ${DB_POOL_MAX_LIFETIME_MS:-600000}
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${DB_POOL_CONNECTION_TIMEOUT_MS:-30000}
  SECURITY_JWT_ENFORCE: "${SECURITY_JWT_ENFORCE:-true}"
  SECURITY_JWT_SECRET: "${SECURITY_JWT_SECRET}"
  SECURITY_INVITE_INTERNAL_KEY: "${SECURITY_INVITE_INTERNAL_KEY:-}"

networks:
  sugamflow_net:
    external: true
    # Compose project "sumanthakur30" -> network sumanthakur30_default
    name: ${SUGAMFLOW_DOCKER_NETWORK:-sumanthakur30_default}

services:
  # -------------------------------------------------------------------------
  # Phase A (always started with plain `up -d`)
  # -------------------------------------------------------------------------
  school-settings-service:
    <<: *jvm-service
    image: ${IMAGE_PREFIX:-sumanthakur30}/school-settings-service:${IMAGE_TAG:-1.0.0}
    environment:
      <<: *common-env
      EUREKA_INSTANCE_HOSTNAME: school-settings-service
      SERVER_PORT: 8181
      SCHOOL_SETTINGS_DB_URL: ${SCHOOL_SETTINGS_DB_URL}
      SCHOOL_SETTINGS_DB_USERNAME: ${SCHOOL_SETTINGS_DB_USERNAME}
      SCHOOL_SETTINGS_DB_PASSWORD: ${SCHOOL_SETTINGS_DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${SCHOOL_SETTINGS_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SCHOOL_SETTINGS_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SCHOOL_SETTINGS_DB_PASSWORD}
      # Docker DNS (never use localhost inside containers)
      SETTINGS_SUBSCRIPTION_URL: http://subscription-service:8182
      SETTINGS_PUBLIC_API_URL: http://gateway-service:9090
      # Optional - empty audit is fine if audit-service not deployed
      SETTINGS_AUDIT_URL: ${SETTINGS_AUDIT_URL:-http://audit-service:8188}

  subscription-service:
    <<: *jvm-service
    image: ${IMAGE_PREFIX:-sumanthakur30}/subscription-service:${IMAGE_TAG:-1.0.0}
